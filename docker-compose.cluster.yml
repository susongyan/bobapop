services:
  redis-cluster-7000:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --port
      - "7000"
      - --cluster-enabled
      - "yes"
      - --cluster-config-file
      - nodes.conf
      - --cluster-node-timeout
      - "5000"
      - --cluster-announce-ip
      - "${REDIS_CLUSTER_HOST_IP:-192.168.65.254}"
      - --cluster-announce-port
      - "7100"
      - --cluster-announce-bus-port
      - "17100"
      - --appendonly
      - "no"
      - --protected-mode
      - "no"
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "7100:7000"
      - "17100:17000"
    volumes:
      - redis-cluster-7000:/data

